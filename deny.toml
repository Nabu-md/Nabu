[advisories]
version = 2
unmaintained = "workspace"
unsound = "all"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "AGPL-3.0"
]

[sources]
unknown-registry = "deny"
unknown-git = "warn"

[bans]
multiple-versions = "warn"
