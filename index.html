<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nabu</title>
    <!-- Critical inline styles: render a dark, branded boot screen before the
         Tailwind stylesheet and the wasm bundle have loaded, so the window
         never flashes white. These do not depend on the network. -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #030712;
        color: #f3f4f6;
        overflow: hidden;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background-color: #030712;
        z-index: 9999;
      }
      #boot-splash .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(59, 130, 246, 0.25);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: nabu-spin 0.8s linear infinite;
      }
      #boot-splash .brand {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        letter-spacing: 0.04em;
        color: #93c5fd;
      }
      @keyframes nabu-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <!-- Build-time Tailwind stylesheet (generated by `npm run css:build`
         via scripts/run-dioxus.sh / build-dioxus.sh). No runtime CDN. -->
    <link rel="stylesheet" href="generated/tailwind.css" />
  </head>
  <body class="bg-gray-950 text-gray-100 m-0 p-0 overflow-hidden">
    <div id="boot-splash">
      <div class="spinner"></div>
      <div class="brand">NABU</div>
    </div>
  </body>
</html>
