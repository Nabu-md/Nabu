[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.97.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Standalone workspace root — src-tauri is intentionally NOT a member of the
# root workspace (which only contains crates/nabu-core). An empty [workspace]
# table keeps this package independently buildable with plain cargo.
[workspace]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0.139"
serde = { version = "1.0.218", features = ["derive"] }
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-log = "2.9.0"
notify = "8.0.0"
parking_lot = "0.12.3"
thiserror = "2.0.11"
anyhow = "1.0.96"
walkdir = "2.5.0"
chrono = "0.4"
rfd = "0.15"
tokio = { version = "1.43.0", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
nabu-core = { path = "../crates/nabu-core" }

