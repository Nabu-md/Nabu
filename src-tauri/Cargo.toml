[package]
name = "nabu"
  version = "0.1.0"
  description = "Personal knowledge and life management app"
  authors = ["Luca Rossi"]
  license = "AGPL-3.0-or-later"
  repository = ""
  edition = "2021"
  rust-version = "1.77.2"

[lib]
name = "nabu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
log = "0.4"
notify = "6.1"
tauri = { version = "2.11.5", features = ["macos-private-api", "protocol-asset", "devtools", "image-png"] }
tauri-plugin-log = "2"
gray_matter = "0.2"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures-util = "0.3"
base64 = "0.22"
regex = "1"
ironcalc_base = "0.7.1"
csv = "1.4"
dirs = "5"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.10.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-opener = "2"
tauri-plugin-prevent-default = "4.0.4"
sentry = "0.37"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-single-instance = { version = "2.4.2", features = ["deep-link"] }
harper-core = "2.8.0"
anydoc = "0.2.4"
fastembed = "3"
duckdb = { version = "1.3.2", features = ["bundled"] }

# Optional gateway dependencies for mini-app external access (see
# miniapp_gateways.rs). Enabled via the `miniapp-gateways` feature; none of
# these are bundled into default builds.
feed-rs = { version = "2.4.0", optional = true }
active-win-pos-rs = { version = "0.11.0", optional = true }
async-imap = { version = "0.11.3", optional = true, default-features = false, features = ["runtime-tokio"] }
tokio-native-tls = { version = "0.3", optional = true }
native-tls = { version = "0.2", optional = true }
mail-parser = { version = "0.11.8", optional = true }
html2text = { version = "0.15.5", optional = true }
toml = { version = "0.8", optional = true }

[features]
miniapp-gateways = [
	"dep:feed-rs",
	"dep:active-win-pos-rs",
	"dep:async-imap",
	"dep:mail-parser",
	"dep:html2text",
	"dep:toml",
	"dep:tokio-native-tls",
	"dep:native-tls",
]

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.2"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
png = "0.17.16"

[dev-dependencies]
