[package]
name = "app"
version = "0.1.0"
description = "Nabu — a Markdown-native knowledge base for the desktop"
authors = ["Nabu Labs <hello@nabu.app>"]
license = "AGPL-3.0"
repository = "https://github.com/Nabu-md/Nabu.git"
edition = "2024"
rust-version = "1.97.1"
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Standalone workspace root — src-tauri is intentionally NOT a member of the
# root workspace (which only contains crates/nabu-core). An empty [workspace]
# table keeps this package independently buildable with plain cargo.
[workspace]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0.139"
serde = { version = "1.0.218", features = ["derive"] }
tracing = { version = "0.1", features = ["attributes"] }
tauri = { version = "2.11.5", features = [] }
thiserror = "2.0.11"
chrono = "0.4"
rfd = "0.15"
tokio = { version = "1.43.0", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
nabu-core = { path = "../crates/nabu-core" }

