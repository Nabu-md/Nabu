[package]
name = "nabu-ui"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"

# Standalone workspace root — nabu-ui is intentionally NOT a member of the
# root workspace (which only contains crates/nabu-core).
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
leptos = { version = "0.7.8", features = ["csr"] }
serde = { version = "1.0.218", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
nabu-core = { path = "../nabu-core", default-features = false }
web-sys = { version = "0.3.77", features = ["CanvasRenderingContext2d", "TextMetrics", "Clipboard", "CustomEvent", "CustomEventInit", "DataTransfer", "Document", "DragEvent", "Element", "File", "FileList", "HtmlCanvasElement", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "KeyboardEvent", "MouseEvent", "Navigator", "NodeList", "WheelEvent", "Window"] }
js-sys = "0.3.77"
wasm-bindgen = "0.2.100"
serde_json = "1.0.139"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen-futures = "0.4.50"
# No `clock` feature: `chrono::Utc::now()` panics on wasm32-unknown-unknown
# without the `wasmbind` feature. Trash relative times use `js_sys::Date::now()`
# instead; chrono is only used for RFC 3339 parsing (no clock needed).
chrono = { version = "0.4", default-features = false, features = ["std"] }
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1.7"
lucide-leptos = { version = "3.26.0", features = ["all-icons"] }
