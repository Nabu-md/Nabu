[package]
name = "nabu-core"
version = "0.1.0"
edition = "2024"

[features]
default = ["native"]
native = [
    "dep:notify",
    "dep:tantivy",
    "dep:whisper-rs",
    "dep:tokio",
]

[dependencies]
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
anyhow = "1.0.96"
pulldown-cmark = "0.13.4"
petgraph = "0.7.0"
uuid = "1.13.0"
walkdir = "2.5.0"
regex = "1.11.1"
tera = "1.20.0"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
sha2 = "0.10"

# Optional native dependencies
tokio = { version = "1.43.0", features = ["full"], optional = true }
notify = { version = "8.0.0", optional = true }
tantivy = { version = "0.26.1", optional = true }
whisper-rs = { version = "0.14.0", optional = true }

[dev-dependencies]
tempfile = "3.10"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.5.2"
objc2-foundation = "0.3.2"
objc2-vision = "0.3.2"
